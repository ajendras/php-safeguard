<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-label="PHP Safeguard — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="572" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="572" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">PHP Safeguard — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#22d3ee">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 2.20s steps(51) 0.60s forwards" fill="#e5e7eb">composer global require php-safeguard/php-safeguard</text>
<text x="50" y="100" class="l" style="animation:show .01s 3.10s forwards" fill="#4ade80">✓ Installed php-safeguard:1.0.0</text>
<text x="50" y="126" class="l" style="animation:show .01s 3.32s forwards" fill="#94a3b8">safeguard binary added to ~/.composer/vendor/bin</text>
<text x="28" y="178" class="l" style="animation:show .01s 3.89s forwards"><tspan fill="#22d3ee">❯</tspan></text><text x="50" y="178" class="l ty" style="animation:show .01s 3.89s forwards,type 0.63s steps(14) 3.89s forwards" fill="#e5e7eb">safeguard init</text>
<text x="50" y="204" class="l" style="animation:show .01s 4.82s forwards" fill="#94a3b8">Created .safeguard.yml with 18 default rules</text>
<text x="50" y="230" class="l" style="animation:show .01s 5.04s forwards" fill="#94a3b8">Laravel mode automatically enabled</text>
<text x="28" y="282" class="l" style="animation:show .01s 5.61s forwards"><tspan fill="#22d3ee">❯</tspan></text><text x="50" y="282" class="l ty" style="animation:show .01s 5.61s forwards,type 1.40s steps(31) 5.61s forwards" fill="#e5e7eb">safeguard scan --format=console</text>
<text x="50" y="308" class="l" style="animation:show .01s 7.31s forwards" fill="#94a3b8">Scanning 14 files...</text>
<text x="50" y="334" class="l" style="animation:show .01s 7.53s forwards" fill="#94a3b8">❌ HIGH: Potential XSS in views/dashboard.php:42</text>
<text x="50" y="360" class="l" style="animation:show .01s 7.75s forwards" fill="#94a3b8">❌ MEDIUM: Mass assignment in UserController.php:19</text>
<text x="50" y="386" class="l" style="animation:show .01s 7.97s forwards" fill="#94a3b8">2 issues found (exit code 1)</text>
<text x="28" y="438" class="l" style="animation:show .01s 8.54s forwards"><tspan fill="#22d3ee">❯</tspan></text><text x="50" y="438" class="l ty" style="animation:show .01s 8.54s forwards,type 0.90s steps(20) 8.54s forwards" fill="#e5e7eb">safeguard scan --fix</text>
<text x="50" y="464" class="l" style="animation:show .01s 9.74s forwards" fill="#94a3b8">Applied htmlspecialchars() wrapper to line 42</text>
<text x="50" y="490" class="l" style="animation:show .01s 9.96s forwards" fill="#94a3b8">✅ Fixed 1 issue. Re-scan to verify.</text>
<g class="l" style="animation:show .01s 10.53s forwards"><text x="28" y="542" fill="#22d3ee">❯</text><rect class="cur" x="50" y="527" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
